<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>
    
    <!-- Node Gradient -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3d59" />
      <stop offset="100%" stop-color="#17b978" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="350" rx="15" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="50%" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="1">PROJECT WORKFLOW PIPELINE</text>

  <!-- Group for flowchart nodes -->
  <g font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">
    
    <!-- ROW 1 -->
    <!-- Node 1: Dataset -->
    <rect x="50" y="80" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="115" y="110">Raw Dataset</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 180 105 L 220 105" stroke="#17b978" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Node 2: Cleaning -->
    <rect x="230" y="80" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="295" y="110">Data Cleaning</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 360 105 L 400 105" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 3: EDA -->
    <rect x="410" y="80" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="475" y="110">Visual EDA</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M 540 105 L 580 105" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 4: Feature Eng -->
    <rect x="590" y="80" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="655" y="105">Feature</text>
    <text x="655" y="120">Engineering</text>

    <!-- Arrow 4 -> 5 -->
    <path d="M 720 105 L 760 105" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 5: Scaling -->
    <rect x="770" y="80" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="835" y="110">Train-Only Scaling</text>

    <!-- Line down and left to Row 2 -->
    <path d="M 835 130 L 835 180 L 115 180 L 115 220" stroke="#17b978" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

    <!-- ROW 2 -->
    <!-- Node 6: Imbalance -->
    <rect x="50" y="230" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="115" y="255">Class Imbalance</text>
    <text x="115" y="270">Handling</text>

    <!-- Arrow 6 -> 7 -->
    <path d="M 180 255 L 220 255" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 7: Training -->
    <rect x="230" y="230" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="295" y="255">Model Training</text>
    <text x="295" y="270">&amp; Tuning</text>

    <!-- Arrow 7 -> 8 -->
    <path d="M 360 255 L 400 255" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 8: Evaluation -->
    <rect x="410" y="230" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="475" y="255">Evaluation &amp;</text>
    <text x="475" y="270">Metrics</text>

    <!-- Arrow 8 -> 9 -->
    <path d="M 540 255 L 580 255" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 9: SHAP -->
    <rect x="590" y="230" width="130" height="50" rx="8" fill="url(#node-grad)" filter="url(#shadow)"/>
    <text x="655" y="255">SHAP Explainable</text>
    <text x="655" y="270">AI</text>

    <!-- Arrow 9 -> 10 -->
    <path d="M 720 255 L 760 255" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Node 10: Deployment -->
    <rect x="770" y="230" width="130" height="50" rx="8" fill="url(#node-grad)" filter="#17b978" style="fill: #17b978;" filter="url(#shadow)"/>
    <text x="835" y="255" fill="#0a192f" font-weight="bold">Streamlit App</text>
    <text x="835" y="270" fill="#0a192f" font-weight="bold">Deployment</text>

  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17b978" />
    </marker>
  </defs>
</svg>

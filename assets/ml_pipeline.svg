<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0d223b" />
    </linearGradient>
    
    <!-- Step Gradient -->
    <linearGradient id="step-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3d59" />
      <stop offset="100%" stop-color="#17b978" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="180" rx="12" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="30" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="0.5">MACHINE LEARNING PIPELINE</text>

  <!-- Pipeline Steps -->
  <g font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    
    <!-- Step 1: Feature Engineering -->
    <rect x="30" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="87.5" y="95">Feature Eng.</text>
    <text x="87.5" y="108">(4 derived)</text>

    <!-- Connection -->
    <path d="M 145 95 L 165 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 2: Encoding -->
    <rect x="165" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="222.5" y="95">Categorical</text>
    <text x="222.5" y="108">Encoding</text>

    <!-- Connection -->
    <path d="M 280 95 L 300 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 3: Split -->
    <rect x="300" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="357.5" y="95">Stratified Split</text>
    <text x="357.5" y="108">(80/20 Split)</text>

    <!-- Connection -->
    <path d="M 415 95 L 435 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 4: Scaling -->
    <rect x="435" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="492.5" y="95">Standard Scaling</text>
    <text x="492.5" y="108">(Train-Only)</text>

    <!-- Connection -->
    <path d="M 550 95 L 570 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 5: Imbalance -->
    <rect x="570" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="627.5" y="95">Imbalance Strategy</text>
    <text x="627.5" y="108">(Class Weights)</text>

    <!-- Connection -->
    <path d="M 685 95 L 705 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 6: Training -->
    <rect x="705" y="70" width="115" height="50" rx="6" fill="url(#step-grad)" filter="url(#shadow)"/>
    <text x="762.5" y="95">XGBoost Tuning</text>
    <text x="762.5" y="108">(RandomizedCV)</text>

    <!-- Connection -->
    <path d="M 820 95 L 840 95" stroke="#17b978" stroke-width="2" fill="none"/>

    <!-- Step 7: Persistence -->
    <rect x="840" y="70" width="130" height="50" rx="6" fill="#17b978" filter="url(#shadow)"/>
    <text x="905" y="95" fill="#0a192f" font-weight="bold">Model Artifacts</text>
    <text x="905" y="108" fill="#0a192f" font-weight="bold">Serialized (models/)</text>

  </g>
</svg>
